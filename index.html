<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Room Tour - Virtual Joystick</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 14px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
        }
        #resetBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(230, 81, 0, 0.85);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }
    </style>
    <!-- Babylon.js CDN & GUI -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="instructions">
        <b>Kontrol:</b><br>
        • <b>HP:</b> Gunakan Joystick Kiri (Maju/Mundur/Samping) & Usap Layar Kanan (Lihat Sekeliling)<br>
        • <b>PC:</b> WASD & Mouse
    </div>

    <button id="resetBtn">🔄 Reset</button>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let camera;
        let fixedFloorHeight = 1.6;
        let initialCameraPosition = new BABYLON.Vector3(0, fixedFloorHeight, 0);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            // Universal Camera sebagai basis
            camera = new BABYLON.UniversalCamera("camera", initialCameraPosition.clone(), scene);
            camera.attachControl(canvas, true);
            camera.speed = 0.2;
            camera.angularSensibility = 2000;

            // Kontrol Keyboard untuk PC
            camera.keysUp.push(87);    // W
            camera.keysDown.push(83);  // S
            camera.keysLeft.push(65);  // A
            camera.keysRight.push(68); // D

            // Light Ambient
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 1.2;

            // Muat Model GLB
            BABYLON.SceneLoader.Append("./", "1_LOW_RESIZED.glb", scene, function (loadedScene) {
                console.log("Model berhasil dimuat!");
            });

            // --- TAMPILKAN JOYSTICK DI HP ---
            if (isMobile) {
                const adt = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                // Background Ring Joystick
                const thumbCenter = new BABYLON.GUI.Ellipse();
                thumbCenter.width = "120px";
                thumbCenter.height = "120px";
                thumbCenter.color = "White";
                thumbCenter.thickness = 3;
                thumbCenter.background = "rgba(0,0,0,0.3)";
                thumbCenter.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                thumbCenter.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
                thumbCenter.left = "30px";
                thumbCenter.top = "-30px";
                adt.addControl(thumbCenter);

                // Knob / Ball Joystick
                const thumbPuck = new BABYLON.GUI.Ellipse();
                thumbPuck.width = "50px";
                thumbPuck.height = "50px";
                thumbPuck.color = "Orange";
                thumbPuck.background = "Orange";
                thumbCenter.addControl(thumbPuck);

                let isDragging = false;
                let xAddPos = 0;
                let yAddPos = 0;

                thumbCenter.onPointerDownObservable.add(function(coordinates) {
                    isDragging = true;
                });

                thumbCenter.onPointerUpObservable.add(function(coordinates) {
                    isDragging = false;
                    thumbPuck.left = 0;
                    thumbPuck.top = 0;
                    xAddPos = 0;
                    yAddPos = 0;
                });

                thumbCenter.onPointerMoveObservable.add(function(coordinates) {
                    if (isDragging) {
                        let x = coordinates.x - (thumbCenter.centerX);
                        let y = coordinates.y - (thumbCenter.centerY);
                        let dist = Math.sqrt(x*x + y*y);
                        if (dist > 40) {
                            x = (x / dist) * 40;
                            y = (y / dist) * 40;
                        }
                        thumbPuck.left = x + "px";
                        thumbPuck.top = y + "px";

                        xAddPos = x / 40;
                        yAddPos = -(y / 40);
                    }
                });

                // Terapkan Pergerakan Kamera berdasarkan Joystick
                scene.onBeforeRenderObservable.add(function() {
                    if (isDragging) {
                        let forward = camera.getDirection(BABYLON.Axis.Z);
                        let right = camera.getDirection(BABYLON.Axis.X);

                        forward.y = 0;
                        right.y = 0;
                        forward.normalize();
                        right.normalize();

                        let moveVector = forward.scale(yAddPos * camera.speed).add(right.scale(xAddPos * camera.speed));
                        camera.position.addInPlace(moveVector);
                    }
                    // Kunci Sumbu Y
                    camera.position.y = fixedFloorHeight;
                });
            }

            return scene;
        };

        const scene = createScene();

        document.getElementById("resetBtn").addEventListener("click", function() {
            camera.position = initialCameraPosition.clone();
        });

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
