<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Room Tour - Multi-Raycast Collision</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 14px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #resetBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(230, 81, 0, 0.85);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s ease;
        }
        #resetBtn:hover {
            background: rgba(255, 112, 67, 1);
        }
    </style>
    <!-- Babylon.js CDN & Loaders -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="instructions">
        <b>Kontrol Room Tour:</b><br>
        • <b>HP:</b> Gunakan Joystick Kiri untuk berjalan & Usap Kanan untuk lihat sekeliling<br>
        • <b>PC/Laptop:</b> Gunakan <b>WASD</b> & Klik Mouse<br>
        • Tekan <b>R</b> di PC atau Tombol Reset untuk kembali ke posisi awal
    </div>

    <button id="resetBtn">🔄 Reset Posisi</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, false, { preserveDrawingBuffer: true, stencil: true });

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let camera;
        let fixedFloorHeight = 1.6;
        let initialCameraPosition = new BABYLON.Vector3(0, fixedFloorHeight, 0);
        let initialCameraTarget = new BABYLON.Vector3(0, fixedFloorHeight, 2);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            // Setup Kamera
            if (isMobile) {
                camera = new BABYLON.VirtualJoysticksCamera("MobileCam", initialCameraPosition.clone(), scene);
                camera.speed = 0.2;
                
                const leftJoystick = camera.getLeftJoystick();
                const rightJoystick = camera.getRightJoystick();
                leftJoystick.setJoystickSensibility(0.03);
                rightJoystick.setJoystickSensibility(0.03);
            } else {
                camera = new BABYLON.UniversalCamera("DesktopCam", initialCameraPosition.clone(), scene);
                camera.attachControl(canvas, true);

                camera.angularSensibilityX = 1000;
                camera.angularSensibilityY = 1000;

                camera.keysUp.push(87);    // W
                camera.keysDown.push(83);  // S
                camera.keysLeft.push(65);  // A
                camera.keysRight.push(68); // D
                camera.speed = 0.25;

                scene.onPointerDown = function () {
                    engine.enterPointerlock();
                };
            }

            camera.minZ = 0.05; // Mencegah visual terpotong saat dekat dinding

            // Pencahayaan
            const lightAmbient = new BABYLON.HemisphericLight("lightAmbient", new BABYLON.Vector3(0, 1, 0), scene);
            lightAmbient.intensity = 1.2;

            const lightDir = new BABYLON.DirectionalLight("lightDir", new BABYLON.Vector3(-1, -2, -1), scene);
            lightDir.intensity = 0.6;

            // Memuat File 1_LOW_RESIZED.glb
            BABYLON.SceneLoader.Append("./", "1_LOW_RESIZED.glb", scene, function (loadedScene) {
                console.log("Model 1_LOW_RESIZED.glb berhasil dimuat!");

                if (loadedScene.meshes.length > 0) {
                    
                    let totalMin = new BABYLON.Vector3(Number.MAX_VALUE, Number.MAX_VALUE, Number.MAX_VALUE);
                    let totalMax = new BABYLON.Vector3(-Number.MAX_VALUE, -Number.MAX_VALUE, -Number.MAX_VALUE);

                    loadedScene.meshes.forEach(function (mesh) {
                        if (mesh.geometry) {
                            mesh.isPickable = true;
                        }

                        if (mesh.getBoundingInfo) {
                            const bounds = mesh.getBoundingInfo().getBoundingBox();
                            totalMin = BABYLON.Vector3.Minimize(totalMin, bounds.minimumWorld);
                            totalMax = BABYLON.Vector3.Maximize(totalMax, bounds.maximumWorld);
                        }
                    });

                    const center = totalMin.add(totalMax).scale(0.5);

                    fixedFloorHeight = totalMin.y + 1.6;

                    initialCameraPosition = new BABYLON.Vector3(center.x, fixedFloorHeight, center.z);
                    initialCameraTarget = center.add(new BABYLON.Vector3(0, 0, 2));

                    resetCameraPosition();

                    // --- SISTEM BUMPER MULTI-RAYCAST ---
                    let prevPosition = camera.position.clone();
                    const checkDistance = 0.8; // Jarak aman benturan (80 cm)

                    scene.onBeforeRenderObservable.add(function () {
                        // Kunci Sumbu Y
                        camera.position.y = fixedFloorHeight;

                        let moveVector = camera.position.subtract(prevPosition);
                        // Bersihkan komponen Y dari pergerakan
                        moveVector.y = 0; 
                        let moveDistance = moveVector.length();

                        if (moveDistance > 0.0001) {
                            let forward = moveVector.normalize();
                            
                            // Hitung vektor samping (kanan)
                            let right = BABYLON.Vector3.Cross(forward, BABYLON.Vector3.Up()).normalize();

                            // Buat 5 Arah Sinar (Depan, Depan-Kiri, Depan-Kanan, Kiri, Kanan)
                            let directions = [
                                forward, // Depan
                                forward.add(right.scale(0.5)).normalize(),  // Depan-Kanan (45 deg)
                                forward.subtract(right.scale(0.5)).normalize(), // Depan-Kiri (45 deg)
                                right, // Kanan
                                right.scale(-1) // Kiri
                            ];

                            let isColliding = false;

                            // Cek kelima sinar
                            for (let dir of directions) {
                                let ray = new BABYLON.Ray(camera.position, dir, checkDistance);
                                let hit = scene.pickWithRay(ray, function (mesh) {
                                    return mesh.isPickable && mesh.isVisible;
                                });

                                if (hit.hit && hit.pickedMesh) {
                                    isColliding = true;
                                    break;
                                }
                            }

                            if (isColliding) {
                                // Tahan kamera jika ada objek terdeteksi di salah satu dari 5 arah
                                camera.position = prevPosition.clone();
                            } else {
                                prevPosition = camera.position.clone();
                            }
                        } else {
                            prevPosition = camera.position.clone();
                        }
                    });
                }
            }, null, function (scene, message, exception) {
                console.error("Gagal memuat file 1_LOW_RESIZED.glb:", message, exception);
            });

            return scene;
        };

        const scene = createScene();

        // Fungsi Reset Posisi Kamera
        function resetCameraPosition() {
            if (camera) {
                camera.position = initialCameraPosition.clone();
                camera.setTarget(initialCameraTarget.clone());
            }
        }

        // Klik Tombol Reset
        document.getElementById("resetBtn").addEventListener("click", function() {
            resetCameraPosition();
        });

        // Tekan Tombol R di Keyboard
        window.addEventListener("keydown", function(e) {
            if (e.key === "r" || e.key === "R") {
                resetCameraPosition();
            }
        });

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
