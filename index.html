<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Room Tour - Native Dual Joystick</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 14px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 12px;
        }
        #resetBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(230, 81, 0, 0.85);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }
    </style>
    <!-- CDN Babylon.js & GUI -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="instructions">
        <b>Kontrol:</b><br>
        • <b>HP:</b> Joystick Kiri (Jalan) | Joystick Kanan (Nengok Atas/Bawah/Samping)<br>
        • <b>PC:</b> Keyboard WASD + Drag Mouse
    </div>

    <button id="resetBtn">🔄 Reset</button>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let camera;
        const fixedFloorHeight = 1.6;
        const initialCameraPosition = new BABYLON.Vector3(0, fixedFloorHeight, 0);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            // Universal Camera
            camera = new BABYLON.UniversalCamera("camera", initialCameraPosition.clone(), scene);
            camera.speed = 0.15;

            // Jika di PC: pasang kontrol keyboard & mouse biasa
            if (!isMobile) {
                camera.attachControl(canvas, true);
                camera.angularSensibility = 2000;
                camera.keysUp.push(87);    // W
                camera.keysDown.push(83);  // S
                camera.keysLeft.push(65);  // A
                camera.keysRight.push(68); // D
            }

            // Light Ambient
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 1.2;

            // Load Model GLB
            BABYLON.SceneLoader.Append("./", "1_LOW_RESIZED.glb", scene, function (loadedScene) {
                console.log("Model berhasil dimuat!");
            });

            // --- SISTEM NATIVE DUAL JOYSTICK MOBILE ---
            if (isMobile) {
                // Matikan kontrol sentuh layar bawaan agar tidak ada gesture bentrok
                camera.detachControl();

                // Buat 2 Joystick Native Babylon GUI
                const leftJoystick = new BABYLON.GUI.VirtualJoystick(true);  // Kiri (Left)
                const rightJoystick = new BABYLON.GUI.VirtualJoystick(false); // Kanan (Right)

                // Ubah warna ring joystick agar mudah dibedakan
                leftJoystick.setContainerSize(100);
                rightJoystick.setContainerSize(100);

                scene.onBeforeRenderObservable.add(function () {
                    // 1. JOYSTICK KIRI: GERAK POSISI (Maju/Mundur/Samping)
                    if (leftJoystick.pressed) {
                        let moveX = leftJoystick.deltaPosition.x;
                        let moveY = leftJoystick.deltaPosition.y;

                        let forward = camera.getDirection(BABYLON.Axis.Z);
                        let right = camera.getDirection(BABYLON.Axis.X);
                        forward.y = 0; right.y = 0;
                        forward.normalize(); right.normalize();

                        let moveVector = forward.scale(moveY * camera.speed).add(right.scale(moveX * camera.speed));
                        camera.position.addInPlace(moveVector);
                    }

                    // 2. JOYSTICK KANAN: MURNI NENGOK (Atas/Bawah/Kiri/Kanan)
                    if (rightJoystick.pressed) {
                        let lookX = rightJoystick.deltaPosition.x;
                        let lookY = rightJoystick.deltaPosition.y;

                        let rotationSpeed = 0.04;
                        camera.rotation.y += lookX * rotationSpeed;  // Kiri - Kanan
                        camera.rotation.x -= lookY * rotationSpeed;  // Atas - Bawah (Mendongak / Menunduk)

                        // Batas rotasi atas/bawah (~75 derajat)
                        let maxAngle = Math.PI / 2.4;
                        camera.rotation.x = Math.max(-maxAngle, Math.min(maxAngle, camera.rotation.x));
                    }

                    // Kunci Ketinggian Mata
                    camera.position.y = fixedFloorHeight;
                });
            }

            return scene;
        };

        const scene = createScene();

        // Tombol Reset Posisi
        document.getElementById("resetBtn").addEventListener("click", function() {
            camera.position = initialCameraPosition.clone();
            camera.rotation = new BABYLON.Vector3(0, 0, 0);
        });

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
